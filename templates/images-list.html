<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <!-- Установка масштаба страницы для адаптивности на мобильных устройствах -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Uploaded Images</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_images.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Upload Photos</h1>
    <p class="subtitle">Upload selfies, memes, or any fun pictures here.</p>
    <!-- Навигационные вкладки -->
    <div class="tabs">
      <a href="{{ url_for('handle_upload') }}" class="tab">Upload</a>
      <a href="{{ url_for('images_list') }}" class="tab active">Images</a>
    </div>
    <!-- Заголовок таблицы -->
      <div class="images-header">
        <div class="column-preview"></div> <!-- Пустая ячейка для превью -->
        <div class="column-filename">Имя файла</div>
        <div class="column-original">Оригинальное имя</div>
        <div class="column-size">Размер (КБ)</div>
        <div class="column-date">Дата загрузки</div>
        <div class="column-type">Тип</div>
        <div class="column-delete">Удалить</div>
      </div>
    <div class="images-table" id="imagesTable" data-images='{{ images | tojson | safe }}'></div>
    <div id="emptyMessage" class="hidden">Нет загруженных изображений.</div>
  </div>
  <!-- Список изображений из backend -->
  <script>
    const imageList = {{ images | tojson | safe }};
  </script>
  <!-- Кнопки пагинации -->
  <div class="pagination">
    <button id="btn-prev" class="pagination-btn">««</button>
    <span id="page-number">{{ page }}</span>
    <span id="page-of">из</span>
    <span id="total-pages">{{ total_pages }}</span>
    <button id="btn-next" class="pagination-btn">»»</button>
  </div>
  <script src="{{ url_for('static', filename='js/images.js') }}"></script>
</body>
</html>
