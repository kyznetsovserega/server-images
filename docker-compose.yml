version: "3.9"

services:
  app:
    build: .
    container_name: flask_app
    ports:
      - "8000"
    depends_on:
      - db
    volumes:
      - ./images:/app/images
      - ./logs:/logs
      - ./static:/app/static
    restart: unless-stopped
    env_file:
      -  .env

  db:
    image: postgres:13
    container_name: pg_database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ./images:/app/images
      - ./static:/app/static
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  images:
  logs:
  db_data:

